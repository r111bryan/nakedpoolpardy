<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nakedpoolpardy — Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family: 'PartyFont';
    src: url('BRLNSR.ttf') format('truetype');
    font-weight: bold;
    font-display: swap;
  }
  :root{
    --navy-deep:#01152b; --navy-cell:#0466c8; --gold:#ffd60a; --gold-dim:#e0b400;
    --white:#eafcff; --danger:#ff4d6d; --success:#06d6a0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    background:
      linear-gradient(rgba(1,21,43,0.6), rgba(1,21,43,0.82)),
      url('nppardyboard.png') center/cover no-repeat,
      radial-gradient(ellipse at 50% -10%, #0096c7 0%, var(--navy-deep) 55%), var(--navy-deep);
    font-family:'Inter',sans-serif; color:var(--white); padding:16px; overflow-x:hidden;
  }
  h1.marquee{
    font-family:'PartyFont','Anton',sans-serif; text-align:center; font-size:2rem; letter-spacing:4px; margin:0 0 14px;
    background:linear-gradient(180deg,#fff 0%, var(--gold) 55%, var(--gold-dim) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .title-image{ display:block; margin:0 auto 14px; max-width:min(85%, 360px); height:auto; }
  .screen{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; max-width:460px; margin:0 auto; width:100%; }
  label{ font-size:0.75rem; letter-spacing:1px; text-transform:uppercase; color:#a7e8ff; }
  input[type=text]{
    width:100%; background:#024a7a; border:1px solid #1f8fd1; border-radius:10px; color:var(--white);
    font-family:'Inter',sans-serif; font-size:1.1rem; padding:14px; text-align:center; letter-spacing:2px;
  }
  input[type=text]:focus{ outline:none; border-color:var(--gold); }
  button{
    font-family:'Inter',sans-serif; font-weight:800; font-size:1rem; letter-spacing:0.5px; text-transform:uppercase;
    border:none; border-radius:10px; padding:16px; cursor:pointer; color:var(--navy-deep); background:var(--gold);
  }
  button:disabled{ opacity:0.35; }
  button.outline{ background:transparent; color:var(--white); border:1.5px solid #1f8fd1; }
  button.small{ padding:9px 14px; font-size:0.75rem; }
  .error{ color:var(--danger); font-size:0.85rem; text-align:center; min-height:1.2em; }

  .avatar{
    width:24px; height:24px; border-radius:50%; object-fit:cover; border:1.5px solid var(--gold);
    vertical-align:middle; background:#0577b8; flex-shrink:0;
  }
  .avatar.big{ width:64px; height:64px; border-width:2px; }
  input[type=file]{ display:none; }

  /* JOIN screen */
  .avatar-row{ display:flex; align-items:center; justify-content:center; gap:12px; }

  /* GAME screen (no join/team steps once in) */
  .game-screen{ flex:1; display:flex; flex-direction:column; gap:16px; max-width:1100px; margin:0 auto; width:100%; padding-bottom:10px; }

  /* Live board — same visual style as the host screen's board */
  .board-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.board{ width:100%; border-collapse:separate; border-spacing:6px; table-layout:fixed; margin:0 auto; }
  .cat-cell{
    background:linear-gradient(180deg,var(--navy-cell),#013a63); border:1px solid #0577b8; border-radius:10px;
    padding:10px 6px; text-align:center; font-family:'PartyFont','Anton',sans-serif; font-size:clamp(0.55rem,3vw,0.85rem);
    letter-spacing:0.4px; text-transform:uppercase; color:var(--white); min-height:56px; vertical-align:middle; min-width:64px;
  }
  .clue-cell{
    background:linear-gradient(180deg,#023e7d,#012e52); border:1px solid #045c9c; border-radius:10px;
    text-align:center; font-family:'PartyFont','Anton',sans-serif; color:var(--gold); font-size:clamp(1rem,4.5vw,1.5rem);
    height:56px; min-width:64px;
  }
  .clue-cell.used{ color:#1477b0; background:#013256; }

  /* Clue view — same styling family as the host's clue modal */
  .clue-view{ background:#024a7a; border:2px solid var(--gold); border-radius:16px; padding:24px; box-shadow:0 0 40px rgba(255,214,10,0.1); }
  .clue-cat-tag{ font-family:'PartyFont','Anton',sans-serif; color:var(--gold); font-size:1rem; letter-spacing:2px; margin-bottom:14px; text-align:center; }
  .clue-media-p{ max-width:100%; max-height:220px; border-radius:8px; margin:0 auto 14px; display:block; border:1px solid #0577b8; }
  .clue-text-p{ font-family:'PartyFont','Anton',sans-serif; font-size:1.3rem; line-height:1.4; text-align:center; }

  .turn-note{ font-size:0.85rem; color:#d6f7ff; text-align:center; min-height:1.4em; }
  .turn-note b{ color:var(--gold); }

  .buzzer-wrap{ display:none; justify-content:center; margin-top:4px; }
  .buzzer-wrap.shown{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .buzzer-btn{
    width:210px; height:210px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'PartyFont','Anton',sans-serif; font-size:1.5rem; letter-spacing:2px; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ff6b5e, var(--danger) 60%, #8c1f1a 100%);
    color:#fff; box-shadow:0 10px 0 #7a1a15, 0 14px 30px rgba(255,77,109,0.4);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .buzzer-btn:active:not(:disabled){ transform:translateY(8px); box-shadow:0 2px 0 #7a1a15, 0 6px 16px rgba(255,77,109,0.3); }
  .buzzer-btn:disabled{
    background:radial-gradient(circle at 35% 30%, #35406e, #202e5c 60%, #131c3d 100%);
    box-shadow:0 10px 0 #0e1530; color:#4fb3d9; cursor:not-allowed;
  }
  .buzzer-btn.won{
    background:radial-gradient(circle at 35% 30%, #6bffa0, var(--success) 60%, #1a7a44 100%);
    box-shadow:0 10px 0 #145c33;
  }

  /* Ordering Puzzle builder */
  .puzzle-builder{ display:none; flex-direction:column; gap:14px; }
  .puzzle-builder.shown{ display:flex; }
  .puzzle-label{ font-size:0.7rem; letter-spacing:1px; text-transform:uppercase; color:#a7e8ff; text-align:center; }
  .puzzle-bank{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:44px;
    background:#013a63; border:1px dashed #0577b8; border-radius:10px; padding:10px;
  }
  .puzzle-chip{
    background:#0466c8; border:1px solid #045c9c; border-radius:20px; padding:9px 16px;
    font-weight:700; font-size:0.85rem; color:var(--white); cursor:grab; touch-action:none; user-select:none;
  }
  .puzzle-chip.ghost{ position:fixed; pointer-events:none; z-index:200; opacity:0.9; box-shadow:0 6px 16px rgba(0,0,0,0.4); }
  .puzzle-slots{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .puzzle-slot{
    width:110px; min-height:46px; background:#012e52; border:2px dashed #1f8fd1; border-radius:10px;
    display:flex; align-items:center; justify-content:center; position:relative; padding:4px;
  }
  .puzzle-slot .slot-num{ position:absolute; top:2px; left:6px; font-size:0.6rem; color:#4fb3d9; }
  .puzzle-slot .puzzle-chip{ cursor:grab; }
  .puzzle-actions{ display:flex; gap:10px; justify-content:center; }
  .puzzle-actions button{ padding:12px 20px; font-size:0.85rem; }
  .puzzle-result-banner{
    text-align:center; font-family:'PartyFont','Anton',sans-serif; font-size:1.1rem; padding:10px; border-radius:10px;
  }
  .puzzle-result-banner.solved{ background:rgba(6,214,160,0.15); color:var(--success); border:1px solid var(--success); }
  .puzzle-result-banner.attempt{ background:rgba(255,77,109,0.12); color:#ffb3c1; border:1px solid var(--danger); }

  /* Leaderboard at bottom */
  .leaderboard{ display:flex; flex-direction:column; gap:8px; }
  .leaderboard-label{ font-size:0.7rem; letter-spacing:1px; text-transform:uppercase; color:#a7e8ff; text-align:center; }
  .leader-row{
    display:flex; align-items:center; gap:12px; background:#024a7a; border:1px solid #0577b8;
    border-radius:12px; padding:10px 14px;
  }
  .leader-row.me{ border-color:var(--gold); background:#035c94; }
  .leader-row.excluded{ opacity:0.5; }
  .leader-name{ flex:1; font-weight:700; font-size:0.95rem; }
  .leader-name .you-tag{ color:var(--gold); font-size:0.7rem; font-weight:400; margin-left:6px; }
  .leader-score{ font-family:'PartyFont','Anton',sans-serif; color:var(--gold); font-size:1.2rem; }
  .change-photo-btn{
    background:none; border:none; color:#a7e8ff; font-size:0.9rem; padding:4px 8px; cursor:pointer;
  }
</style>
</head>
<body>
<img class="title-image" src="nakedpoolpardy.png" alt="Nakedpoolpardy!">

<!-- JOIN -->
<div class="screen" id="joinScreen">
  <div>
    <label>Lobby code</label>
    <input type="text" id="codeInput" maxlength="4" placeholder="ABCD" autocapitalize="characters">
  </div>
  <div>
    <label>Your name</label>
    <input type="text" id="nameInput" maxlength="24" placeholder="Your name">
  </div>
  <div>
    <label>Profile picture (optional)</label>
    <div class="avatar-row">
      <img class="avatar big" id="avatarPreview" style="display:none;">
      <button type="button" class="outline small" id="avatarPickBtn">Choose Photo</button>
      <input type="file" id="avatarInput" accept="image/*">
    </div>
  </div>
  <button id="joinBtn">Join Game</button>
  <div class="error" id="joinError"></div>
</div>

<!-- GAME (board + clue + buzzer + leaderboard) -->
<div class="game-screen" id="gameScreen" style="display:none;">
  <div class="board-wrap" id="liveBoardWrap" style="display:none;"><table class="board" id="miniBoardTable"></table></div>

  <div class="clue-view" id="clueView" style="display:none;">
    <div class="clue-cat-tag" id="clueCatTag"></div>
    <img class="clue-media-p" id="clueImg" style="display:none;">
    <video class="clue-media-p" id="clueVideo" style="display:none;" controls muted playsinline></video>
    <div class="clue-text-p" id="clueTextP"></div>
  </div>

  <div class="puzzle-result-banner" id="puzzleResultBanner" style="display:none;"></div>

  <div class="puzzle-builder" id="puzzleBuilder">
    <div class="puzzle-label">Drag names into order</div>
    <div class="puzzle-bank" id="puzzleBank"></div>
    <div class="puzzle-label">Your order</div>
    <div class="puzzle-slots" id="puzzleSlots"></div>
    <div class="puzzle-actions">
      <button class="outline small" id="puzzleClearBtn">Clear</button>
      <button class="gold" id="puzzleSubmitBtn" disabled>Submit Order</button>
    </div>
  </div>

  <div class="turn-note" id="turnNote"></div>

  <div class="buzzer-wrap" id="buzzerWrap"><button class="buzzer-btn" id="buzzerBtn" disabled>WAIT</button></div>

  <div class="leaderboard">
    <div class="leaderboard-label">Players</div>
    <div id="leaderboardList"></div>
  </div>
</div>

<input type="file" id="avatarInput2" accept="image/*">

<script>
let ws = null;
let playerId = sessionStorage.getItem('jeopardy_player_id') || null;
let S = null;
let pendingAvatarDataUrl = null;

function resizeImageFile(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => {
    if (playerId) ws.send(JSON.stringify({ type: 'player_reconnect', playerId }));
  };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'joined') {
      playerId = msg.playerId;
      sessionStorage.setItem('jeopardy_player_id', playerId);
      if (pendingAvatarDataUrl) { send({ type: 'set_avatar', dataUrl: pendingAvatarDataUrl }); pendingAvatarDataUrl = null; }
      showScreen('gameScreen');
    } else if (msg.type === 'join_error') {
      document.getElementById('joinError').textContent = msg.message;
      sessionStorage.removeItem('jeopardy_player_id');
      playerId = null;
      showScreen('joinScreen');
    } else if (msg.type === 'kicked') {
      sessionStorage.removeItem('jeopardy_player_id');
      alert('You were removed from the game.');
      location.reload();
    } else if (msg.type === 'state') {
      S = msg;
      render();
    }
  };
  ws.onclose = () => { setTimeout(connect, 1500); };
}
connect();

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function showScreen(id) {
  ['joinScreen', 'gameScreen'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? (s === 'gameScreen' ? 'flex' : 'flex') : 'none';
  });
}

document.getElementById('avatarPickBtn').onclick = () => document.getElementById('avatarInput').click();
document.getElementById('avatarInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const dataUrl = await resizeImageFile(file, 160);
  pendingAvatarDataUrl = dataUrl;
  const preview = document.getElementById('avatarPreview');
  preview.src = dataUrl; preview.style.display = 'inline-block';
};

document.getElementById('avatarInput2').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const dataUrl = await resizeImageFile(file, 160);
  send({ type: 'set_avatar', dataUrl });
  e.target.value = '';
};

document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  if (code.length !== 4) { document.getElementById('joinError').textContent = 'Enter the 4-letter lobby code.'; return; }
  if (!name) { document.getElementById('joinError').textContent = 'Enter your name.'; return; }
  document.getElementById('joinError').textContent = '';
  send({ type: 'player_join', lobbyCode: code, name });
};

function blankAvatar() {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" fill="%230577b8"/></svg>');
}

let puzzleSlots = [];
let puzzleBank = [];
let wasMyPuzzleTurn = false;
let lastMediaKey = null;

function render() {
  if (!S || !S.you) return;
  showScreen('gameScreen');

  const liveBoardWrap = document.getElementById('liveBoardWrap');
  const clueView = document.getElementById('clueView');
  const buzzerWrap = document.getElementById('buzzerWrap');
  const puzzleBuilder = document.getElementById('puzzleBuilder');
  const resultBanner = document.getElementById('puzzleResultBanner');
  const note = document.getElementById('turnNote');

  if (!S.current) {
    liveBoardWrap.style.display = 'block';
    clueView.style.display = 'none';
    buzzerWrap.classList.remove('shown');
    puzzleBuilder.classList.remove('shown');
    resultBanner.style.display = 'none';
    note.style.display = 'none';
    wasMyPuzzleTurn = false;
    lastMediaKey = null;
    document.getElementById('clueVideo').pause();
    renderLiveBoard();
    return;
  }

  liveBoardWrap.style.display = 'none';
  clueView.style.display = 'block';
  note.style.display = 'block';
  document.getElementById('clueCatTag').textContent = S.current.isDailyDouble
    ? 'DAILY DOUBLE — ' + S.current.catName.toUpperCase()
    : S.current.isPuzzle
      ? S.current.catName.toUpperCase() + ' — ORDERING PUZZLE (solve for $' + (S.current.value * 2) + ')'
      : S.current.catName.toUpperCase() + ' — $' + S.current.value;
  document.getElementById('clueTextP').textContent = S.current.clueText || '';
  const img = document.getElementById('clueImg');
  const vid = document.getElementById('clueVideo');
  const mediaKey = S.current.catName + '-' + S.current.clueText + '-' + (S.current.media ? S.current.media.dataUrl : '');
  if (mediaKey !== lastMediaKey) {
    lastMediaKey = mediaKey;
    img.style.display = 'none'; vid.style.display = 'none'; vid.pause(); vid.removeAttribute('src'); vid.load();
    if (S.current.media) {
      if (S.current.media.type === 'video') { vid.src = S.current.media.dataUrl; vid.style.display = 'block'; }
      else { img.src = S.current.media.dataUrl; img.style.display = 'block'; }
    }
  }
  if (S.current.media && S.current.media.type === 'video') {
    // Video follows the buzz lock: playing while open for guessing, paused the instant
    // someone buzzes in, resuming automatically if the host reopens after a wrong answer.
    if (S.current.locked) vid.pause();
    else vid.play().catch(() => {});
  }

  const btn = document.getElementById('buzzerBtn');
  btn.classList.remove('won');

  if (S.current.isPuzzle) {
    const isMyTurn = S.current.locked && S.current.winner && S.current.winner.playerId === S.you.id && !S.current.solved;

    resultBanner.style.display = 'none';
    if (S.current.solved) {
      resultBanner.style.display = 'block';
      resultBanner.className = 'puzzle-result-banner solved';
      resultBanner.textContent = '🎉 ' + S.current.winner.playerName + ' solved it! +$' + (S.current.value * 2);
    } else if (S.current.attemptResult) {
      resultBanner.style.display = 'block';
      resultBanner.className = 'puzzle-result-banner attempt';
      resultBanner.textContent = S.current.attemptResult.playerName + ' got ' + S.current.attemptResult.correctCount + ' of ' + S.current.attemptResult.total + ' correct';
    }

    if (isMyTurn) {
      buzzerWrap.classList.remove('shown');
      puzzleBuilder.classList.add('shown');
      note.style.display = 'none';
      if (!wasMyPuzzleTurn) {
        puzzleBank = (S.current.puzzlePool || []).slice();
        puzzleSlots = new Array(puzzleBank.length).fill(null);
        renderPuzzleBuilder();
      }
    } else {
      puzzleBuilder.classList.remove('shown');
      note.style.display = 'block';
      if (S.current.solved) {
        btn.disabled = true; btn.textContent = 'WAIT';
        buzzerWrap.classList.remove('shown');
        note.style.display = 'none';
      } else if (S.current.locked) {
        btn.disabled = true; btn.textContent = 'WAIT';
        buzzerWrap.classList.add('shown');
        note.innerHTML = '<b>' + S.current.winner.playerName + '</b> is arranging their answer…';
      } else if (S.current.buzzingOpen) {
        buzzerWrap.classList.add('shown');
        if (S.buzzEnabled) {
          btn.disabled = false; btn.textContent = 'BUZZ IN';
          note.innerHTML = 'Buzz to take a shot at the order!';
        } else {
          btn.disabled = true; btn.textContent = 'OUT';
          note.innerHTML = 'You already tried this puzzle — wait for the next round.';
        }
      } else {
        buzzerWrap.classList.add('shown');
        btn.disabled = true; btn.textContent = 'WAIT';
        note.innerHTML = 'Get ready — buzzers will open soon.';
      }
    }
    wasMyPuzzleTurn = isMyTurn;
    renderLeaderboard();
    return;
  }

  wasMyPuzzleTurn = false;
  puzzleBuilder.classList.remove('shown');
  resultBanner.style.display = 'none';
  buzzerWrap.classList.add('shown');

  if (S.current.isDailyDouble) {
    btn.disabled = true; btn.textContent = 'WAIT';
    note.innerHTML = '⭐ Daily Double in progress — no buzzing needed.';
  } else if (S.current.locked) {
    if (S.current.winner && S.current.winner.playerId === S.you.id) {
      btn.disabled = true; btn.textContent = 'GOT IT!'; btn.classList.add('won');
      note.innerHTML = 'You buzzed in first!';
    } else {
      btn.disabled = true; btn.textContent = 'LOCKED';
      note.innerHTML = S.current.winner ? ('<b>' + S.current.winner.playerName + '</b> buzzed first.') : 'Someone else buzzed first.';
    }
  } else if (S.current.buzzingOpen) {
    if (S.buzzEnabled) {
      btn.disabled = false; btn.textContent = 'BUZZ IN';
      note.innerHTML = 'Buzz now!';
    } else {
      btn.disabled = true; btn.textContent = 'OUT';
      note.innerHTML = 'You already tried this question.';
    }
  } else {
    btn.disabled = true; btn.textContent = 'WAIT';
    note.innerHTML = 'Get ready — buzzers will open soon.';
  }

  renderLeaderboard();
}

// ---------- Ordering Puzzle builder (drag and drop) ----------
function renderPuzzleBuilder() {
  const bankEl = document.getElementById('puzzleBank');
  const slotsEl = document.getElementById('puzzleSlots');
  bankEl.innerHTML = '';
  slotsEl.innerHTML = '';

  puzzleBank.forEach((name) => {
    bankEl.appendChild(makePuzzleChip(name, 'bank'));
  });

  puzzleSlots.forEach((name, i) => {
    const slot = document.createElement('div');
    slot.className = 'puzzle-slot';
    slot.dataset.index = i;
    const num = document.createElement('div');
    num.className = 'slot-num';
    num.textContent = i + 1;
    slot.appendChild(num);
    if (name) slot.appendChild(makePuzzleChip(name, i));
    slotsEl.appendChild(slot);
  });

  document.getElementById('puzzleSubmitBtn').disabled = puzzleSlots.some((s) => s === null);
}

function makePuzzleChip(name, source) {
  const chip = document.createElement('div');
  chip.className = 'puzzle-chip';
  chip.textContent = name;
  chip.addEventListener('pointerdown', (e) => startPuzzleDrag(e, chip, name, source));
  return chip;
}

function startPuzzleDrag(e, chipEl, name, source) {
  e.preventDefault();
  const ghost = chipEl.cloneNode(true);
  ghost.classList.add('ghost');
  const rect = chipEl.getBoundingClientRect();
  const offsetX = e.clientX - rect.left;
  const offsetY = e.clientY - rect.top;
  ghost.style.width = rect.width + 'px';
  ghost.style.left = (e.clientX - offsetX) + 'px';
  ghost.style.top = (e.clientY - offsetY) + 'px';
  document.body.appendChild(ghost);
  chipEl.style.opacity = '0.25';

  function onMove(ev) {
    ghost.style.left = (ev.clientX - offsetX) + 'px';
    ghost.style.top = (ev.clientY - offsetY) + 'px';
  }
  function onUp(ev) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    ghost.remove();
    chipEl.style.opacity = '1';
    const dropEl = document.elementFromPoint(ev.clientX, ev.clientY);
    const slotEl = dropEl && dropEl.closest('.puzzle-slot');
    const bankEl = dropEl && dropEl.closest('.puzzle-bank');
    if (slotEl) {
      placePuzzleChip(name, source, Number(slotEl.dataset.index));
    } else if (bankEl) {
      returnPuzzleChipToBank(name, source);
    }
    renderPuzzleBuilder();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function placePuzzleChip(name, source, targetIndex) {
  if (source === targetIndex) return;
  const displaced = puzzleSlots[targetIndex];
  if (source === 'bank') {
    puzzleBank.splice(puzzleBank.indexOf(name), 1);
  } else {
    puzzleSlots[source] = null;
  }
  puzzleSlots[targetIndex] = name;
  if (displaced !== null && displaced !== undefined) {
    if (source === 'bank') puzzleBank.push(displaced);
    else puzzleSlots[source] = displaced;
  }
}

function returnPuzzleChipToBank(name, source) {
  if (source === 'bank') return;
  puzzleSlots[source] = null;
  puzzleBank.push(name);
}

document.getElementById('puzzleClearBtn').onclick = () => {
  puzzleBank = puzzleBank.concat(puzzleSlots.filter(Boolean));
  puzzleSlots = new Array(puzzleSlots.length).fill(null);
  renderPuzzleBuilder();
};

document.getElementById('puzzleSubmitBtn').onclick = () => {
  if (puzzleSlots.some((s) => s === null)) return;
  send({ type: 'submit_puzzle_guess', guessOrder: puzzleSlots.slice() });
  document.getElementById('puzzleSubmitBtn').disabled = true;
};

function renderLiveBoard() {
  const table = document.getElementById('miniBoardTable');
  if (!S.board) { table.innerHTML = ''; return; }
  table.innerHTML = '';

  const catRow = document.createElement('tr');
  S.board.forEach(cat => {
    const td = document.createElement('td');
    td.className = 'cat-cell';
    td.textContent = cat.name;
    catRow.appendChild(td);
  });
  table.appendChild(catRow);

  const rowCount = Math.max(...S.board.map(c => c.clues.length), 0);
  for (let r = 0; r < rowCount; r++) {
    const tr = document.createElement('tr');
    S.board.forEach(cat => {
      const clue = cat.clues[r];
      const td = document.createElement('td');
      if (!clue) { tr.appendChild(td); return; }
      td.className = 'clue-cell' + (clue.used ? ' used' : '');
      td.textContent = clue.used ? '' : ('$' + clue.value);
      tr.appendChild(td);
    });
    table.appendChild(tr);
  }
}

function renderLeaderboard() {
  const list = document.getElementById('leaderboardList');
  list.innerHTML = '';
  const sorted = [...S.players].sort((a, b) => b.score - a.score);
  sorted.forEach(p => {
    const isMe = p.id === S.you.id;
    const excluded = S.current && (S.current.excludedPlayerIds || []).includes(p.id);
    const row = document.createElement('div');
    row.className = 'leader-row' + (isMe ? ' me' : '') + (excluded ? ' excluded' : '');
    row.style.marginBottom = '8px';

    const img = document.createElement('img');
    img.className = 'avatar';
    img.style.width = '36px'; img.style.height = '36px';
    img.src = p.avatar || blankAvatar();
    row.appendChild(img);

    const nameDiv = document.createElement('div');
    nameDiv.className = 'leader-name';
    nameDiv.textContent = p.name;
    if (isMe) {
      const tag = document.createElement('span');
      tag.className = 'you-tag';
      tag.textContent = '(you)';
      nameDiv.appendChild(tag);
    }
    row.appendChild(nameDiv);

    if (isMe) {
      const changeBtn = document.createElement('button');
      changeBtn.className = 'change-photo-btn';
      changeBtn.textContent = '📷';
      changeBtn.title = 'Change photo';
      changeBtn.onclick = () => document.getElementById('avatarInput2').click();
      row.appendChild(changeBtn);
    }

    const scoreDiv = document.createElement('div');
    scoreDiv.className = 'leader-score';
    scoreDiv.textContent = '$' + p.score;
    row.appendChild(scoreDiv);

    list.appendChild(row);
  });
}

document.getElementById('buzzerBtn').onclick = () => {
  send({ type: 'player_buzz' });
  if (navigator.vibrate) navigator.vibrate(60);
};
</script>
</body>
</html>
